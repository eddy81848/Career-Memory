# Nightly Full Regression CI Workflow (INF-09 Zero-Secret, Zero-Cloud-Cost Safety Net)
#
# - Runs daily at 04:17 KST (19:17 UTC) and on manual `workflow_dispatch`.
# - Skips heavy jobs automatically in ~10s on quiet days when `main` has 0 new commits
#   since the last successful Nightly CI run.
# - When `main` has new commits (or `workflow_dispatch`), executes 100% of all Backend,
#   PostgreSQL 18, M0 Spike, FE↔BE HTTP Contract, Web Unit/Build, and Playwright UI E2E suites
#   with 0 cloud deployments and 0 secrets.

name: Nightly CI — 전체 회귀 검증

on:
  schedule:
    # 19:17 UTC = 04:17 KST (offset from :00 to avoid GitHub Actions top-of-hour queue spikes)
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      force_run:
        description: "신규 커밋이 없어도 전체 회귀 테스트 강제 실행"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: nightly-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: 1. 신규 커밋 확인 & 정적 무결성 점검
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check_new.outputs.should_run }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify M0 immutable OpenAPI snapshot blob hash
        run: |
          ACTUAL="$(git rev-parse HEAD:contracts/import-v1/openapi.yaml)"
          EXPECTED="07594d75425744d6149250a9f7ff95ac24659f80"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: contracts/import-v1/openapi.yaml was mutated ($ACTUAL != $EXPECTED)" >&2
            exit 1
          fi

      - name: Check if main has new commits since last successful Nightly CI
        id: check_new
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_RUN: ${{ inputs.force_run }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          event_name = os.environ.get("EVENT_NAME", "")
          force_run = os.environ.get("FORCE_RUN", "true").lower() == "true"
          repo = os.environ["REPO"]
          head_sha = os.environ["HEAD_SHA"].strip()
          token = os.environ.get("GITHUB_TOKEN", "")
          gh_out = os.environ["GITHUB_OUTPUT"]

          should_run = True
          if event_name == "schedule" or not force_run:
              try:
                  req = urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/actions/workflows/nightly-ci.yml/runs?branch=main&status=success&per_page=5",
                      headers={
                          "Accept": "application/vnd.github+json",
                          "Authorization": f"Bearer {token}",
                          "X-GitHub-Api-Version": "2022-11-28",
                      },
                  )
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      runs = json.loads(resp.read().decode("utf-8")).get("workflow_runs", [])
                  last_sha = next((r.get("head_sha", "").strip() for r in runs if r.get("head_sha")), "")
                  if last_sha and last_sha == head_sha:
                      print(f"✓ No new commits on main since last green Nightly CI ({head_sha[:7]}); skipping full suite.")
                      should_run = False
                  else:
                      print(f"New commits detected since last green Nightly CI ({last_sha[:7] or 'none'} -> {head_sha[:7]}); running full suite.")
              except Exception as exc:
                  print(f"Nightly history lookup fell back to full run ({type(exc).__name__}).")
                  should_run = True
          else:
              print(f"Manual dispatch (force_run=true) at {head_sha[:7]}; running full suite.")

          with open(gh_out, "a", encoding="utf-8") as fh:
              fh.write(f"should_run={'true' if should_run else 'false'}\n")
          PY

  full-backend-and-contracts:
    name: 2A. Backend · PostgreSQL 18 · 계약 전수 검증
    needs: [gate]
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Install PostgreSQL 18
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Run Static Conformance, T-506 Gate & Full API + PG18 Suite
        working-directory: apps/api
        run: |
          uv run python ../../scripts/run_conformance_ci.py --with-postgres
          uv run python ../../scripts/run_t506_pilot_gate.py --verify
          uv run pytest -q -m ""

      - name: Run M0 CONTRACT-06 Initial Import Regression
        working-directory: apps/api
        run: >-
          uv run --with-requirements ../../spikes/import-contract/requirements.txt
          python -m pytest -q ../../spikes/import-contract/test_contract.py

      - name: Set up Node.js 22 for Live FE↔BE HTTP Contract Suite
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Run Live FE↔BE HTTP Contract Interop Tests (30 tests against real FastAPI + PG18)
        run: |
          cd apps/api && uv sync --frozen
          cd ../web && npm ci && npm run test:contract-http

  full-web-and-e2e:
    name: 2B. Web · BFF · Playwright UI E2E 전수 검증
    needs: [gate]
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install apps/web dependencies & Playwright Chromium
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Typecheck, Unit/Security Tests, Standalone Build & 16 Playwright UI E2E Scenarios
        working-directory: apps/web
        run: |
          npm run typecheck
          npm test
          npm run build
          npm run test:e2e

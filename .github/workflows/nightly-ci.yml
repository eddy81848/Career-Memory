# Nightly Live Server & Full Regression CI Workflow (INF-09 Keyless OIDC WIF + Commit-Aware Safety Net)
#
# - Runs daily at 04:17 KST (19:17 UTC) and on manual `workflow_dispatch`.
# - Job 1 (`1. 라이브 배포 서버 E2E 검증`) ALWAYS executes every night against the currently deployed
#   Cloud Run instances (`cm-web`, `cm-api`, `cm-worker`), live Supabase Auth + PostgREST isolation,
#   and read-only OD-015 Free-Tier Cloud Pre-Flight (`GO`) using keyless OIDC WIF (0 static keys).
# - Jobs 3A & 3B execute the full local PostgreSQL 18, M0 Spike, FE↔BE HTTP Contract, Web Build,
#   and 16-scenario Playwright UI regression suites whenever `main` has new commits (or `force_run`).

name: Nightly CI — 라이브 서버 & 전체 회귀 검증

on:
  schedule:
    # 19:17 UTC = 04:17 KST (offset from :00 to avoid GitHub Actions top-of-hour queue spikes)
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      force_run:
        description: "신규 커밋이 없어도 코드 레벨 전체 회귀 테스트(3A/3B) 강제 실행"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: nightly-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  GCP_REGION: us-central1
  CLOUDSDK_CORE_DISABLE_PROMPTS: "1"

jobs:
  live-server-e2e:
    name: 1. 라이브 배포 서버 E2E 검증 (Cloud Run · Supabase)
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify M0 immutable OpenAPI snapshot blob hash
        run: |
          ACTUAL="$(git rev-parse HEAD:contracts/import-v1/openapi.yaml)"
          EXPECTED="07594d75425744d6149250a9f7ff95ac24659f80"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: contracts/import-v1/openapi.yaml was mutated ($ACTUAL != $EXPECTED)" >&2
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Set up Node.js 22 for Playwright Live Hosted Browser E2E
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install apps/web dependencies & Playwright Chromium
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Authenticate to Google Cloud via keyless OIDC Workload Identity Federation
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Run Comprehensive Live Deployed Server E2E (Origin-HMAC · Worker-OIDC · Playwright · PostgREST · OD-015)
        working-directory: apps/api
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          DEPLOY_SA: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          PUBLIC_WEB_ORIGIN: ${{ vars.STAGING_ALLOWED_WEB_ORIGINS }}
        run: |
          LIVE_WEB_RUN_URL="$(CLOUDSDK_METRICS_ENVIRONMENT="${CLOUDSDK_METRICS_ENVIRONMENT:+$CLOUDSDK_METRICS_ENVIRONMENT }datacloud.antigravity" gcloud run services describe cm-web --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          uv run python ../../scripts/run_live_server_e2e.py \
            --project-id "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --deploy-service-account "$DEPLOY_SA" \
            --fetch-gcp-credentials \
            --web-url "$LIVE_WEB_RUN_URL" \
            --supabase-url "$SUPABASE_URL" \
            --phase-label "Nightly Live Deployed Server E2E (Cloud Run · Supabase)" \
            --output /tmp/nightly-live-e2e-report.json
          if [ -n "${PUBLIC_WEB_ORIGIN:-}" ]; then
            CF_INTERNAL_CODE="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "${PUBLIC_WEB_ORIGIN%/}/internal/worker/wake")"
            test "$CF_INTERNAL_CODE" = "403"
            echo "✓ Cloudflare edge ${PUBLIC_WEB_ORIGIN} /internal/* block verified (403)."
          fi

  gate:
    name: 2. 신규 커밋 확인
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check_new.outputs.should_run }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify M0 immutable OpenAPI snapshot blob hash
        run: |
          ACTUAL="$(git rev-parse HEAD:contracts/import-v1/openapi.yaml)"
          EXPECTED="07594d75425744d6149250a9f7ff95ac24659f80"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: contracts/import-v1/openapi.yaml was mutated ($ACTUAL != $EXPECTED)" >&2
            exit 1
          fi

      - name: Check if main has new commits since last successful Nightly CI
        id: check_new
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_RUN: ${{ inputs.force_run }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          event_name = os.environ.get("EVENT_NAME", "")
          force_run = os.environ.get("FORCE_RUN", "true").lower() == "true"
          repo = os.environ["REPO"]
          head_sha = os.environ["HEAD_SHA"].strip()
          token = os.environ.get("GITHUB_TOKEN", "")
          gh_out = os.environ["GITHUB_OUTPUT"]

          should_run = True
          if event_name == "schedule" or not force_run:
              try:
                  req = urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/actions/workflows/nightly-ci.yml/runs?branch=main&status=success&per_page=5",
                      headers={
                          "Accept": "application/vnd.github+json",
                          "Authorization": f"Bearer {token}",
                          "X-GitHub-Api-Version": "2022-11-28",
                      },
                  )
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      runs = json.loads(resp.read().decode("utf-8")).get("workflow_runs", [])
                  last_sha = next((r.get("head_sha", "").strip() for r in runs if r.get("head_sha")), "")
                  if last_sha and last_sha == head_sha:
                      print(f"✓ No new commits on main since last green Nightly CI ({head_sha[:7]}); skipping code-level rebuild while Live Server E2E runs.")
                      should_run = False
                  else:
                      print(f"New commits detected since last green Nightly CI ({last_sha[:7] or 'none'} -> {head_sha[:7]}); running full code regression suite.")
              except Exception as exc:
                  print(f"Nightly history lookup fell back to full run ({type(exc).__name__}).")
                  should_run = True
          else:
              print(f"Manual dispatch (force_run=true) at {head_sha[:7]}; running full code regression suite.")

          with open(gh_out, "a", encoding="utf-8") as fh:
              fh.write(f"should_run={'true' if should_run else 'false'}\n")
          PY

  full-backend-and-contracts:
    name: 3A. Backend · PG18 · 계약 전수 검증
    needs: [gate]
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Install PostgreSQL 18
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Run Static Conformance, T-506 Gate & Full API + PG18 Suite
        working-directory: apps/api
        run: |
          uv run python ../../scripts/run_conformance_ci.py --with-postgres
          uv run python ../../scripts/run_t506_pilot_gate.py --verify
          uv run pytest -q -m ""

      - name: Run M0 CONTRACT-06 Initial Import Regression
        working-directory: apps/api
        run: >-
          uv run --with-requirements ../../spikes/import-contract/requirements.txt
          python -m pytest -q ../../spikes/import-contract/test_contract.py

      - name: Set up Node.js 22 for Live FE↔BE HTTP Contract Suite
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Run Live FE↔BE HTTP Contract Interop Tests (30 tests against real FastAPI + PG18)
        run: |
          cd apps/api && uv sync --frozen
          cd ../web && npm ci && npm run test:contract-http

  full-web-and-e2e:
    name: 3B. Web · UI 전수 검증
    needs: [gate]
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install apps/web dependencies & Playwright Chromium
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Typecheck, Unit/Security Tests, Standalone Build & 16 Playwright UI E2E Scenarios
        working-directory: apps/web
        run: |
          npm run typecheck
          npm test
          npm run build
          npm run test:e2e

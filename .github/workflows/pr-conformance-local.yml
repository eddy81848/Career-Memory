# Local / PR Conformance & Drift CI Workflow (T-106 + T-106A + apps/web Gate)
#
# Hosting Boundary Notice:
#   Per owner decision, hosted staging/cloud deployment (T-106B: Cloud Run,
#   Artifact Registry, WIF, and hosted Supabase staging deployment) is
#   DEFERRED / WAIVED for the current local MVP gate (not executed).
#   This workflow intentionally contains ZERO cloud credentials, ZERO paid
#   scanners, and ZERO deployment steps. It enforces pure contract, enum,
#   AI JSON Schema, OpenAPI, local PostgreSQL 18 conformance, and apps/web
#   typecheck/test/build checks.

name: PR Conformance, PG18 & Web Gate (Local / No Cloud Deploy)

on:
  pull_request:
    branches: [main, "foundation/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance-and-tests:
    name: API, Contract, AI Schema, PG18 & Web Conformance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify M0 immutable OpenAPI snapshot blob hash
        run: |
          ACTUAL="$(git rev-parse HEAD:contracts/import-v1/openapi.yaml)"
          EXPECTED="07594d75425744d6149250a9f7ff95ac24659f80"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: contracts/import-v1/openapi.yaml was mutated ($ACTUAL != $EXPECTED)" >&2
            exit 1
          fi

      - name: Install PostgreSQL 18 client/server binaries (ephemeral local cluster)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Run Integrated API & PostgreSQL 18 Test Suite
        working-directory: apps/api
        run: uv run pytest -v -m ""

      - name: Run T-106 / T-106A Conformance & Drift CI Gate (Static + Fresh/Staged PG18)
        working-directory: apps/api
        run: uv run python ../../scripts/run_conformance_ci.py --with-postgres

      - name: Run T-506 3-Tier Release Gate Verification (0 Drift)
        working-directory: apps/api
        run: uv run python ../../scripts/run_t506_pilot_gate.py --verify

      - name: Run M0 CONTRACT-06 Initial Import Regression Suite (38 tests)
        working-directory: apps/api
        run: >-
          uv run --with-requirements ../../spikes/import-contract/requirements.txt
          python -m pytest -v ../../spikes/import-contract/test_contract.py

      - name: Set up Node.js 22 for apps/web
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install apps/web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Typecheck apps/web
        working-directory: apps/web
        run: npm run typecheck

      - name: Run apps/web unit tests
        working-directory: apps/web
        run: npm test

      - name: Build apps/web production bundle
        working-directory: apps/web
        run: npm run build

[project]
name = "career-memory-api"
version = "0.1.0"
description = "Local FastAPI foundation scaffold for Career Memory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "psycopg[binary]>=3.2,<4.0",
  "psycopg-pool>=3.2,<4.0",
  "uvicorn>=0.32.0,<1.0.0",
]

[dependency-groups]
dev = [
  "httpx2>=0.1.0",
  "pytest>=8.3.0,<10.0.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/career_memory_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers -m 'not postgres'"
markers = [
  "postgres: Ephemeral local PostgreSQL tests (opt-in via `-m postgres` or `-m ''`)",
]

openapi: 3.1.0
info:
  title: Career Memory Initial Import API
  version: 0.3.0-draft
  description: >
    T-106 WEB review candidate for import acceptance, recovery, status, and retry.
    Paths with an undecided response use a response range or default without a
    payload schema. Product contract approval is pending.
externalDocs:
  description: MVP API Specification
  url: https://app.notion.com/p/3e3f86591b5f81c5b25ce48dd61263fa
security:
  - SupabaseAccessJWT: []
paths:
  /v1/source-accounts/github:
    post:
      operationId: connectGitHubSourceAccount
      summary: Connect a GitHub collection account and check its scope
      description: >
        Authenticated Workspace operation. The collection grant is separate
        from the service login. Connection initiation and callback wire
        semantics depend on OD-011.
      x-pending-decisions: [connection-wire, session-and-scope]
      responses:
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default:
          description: Connection outcome status and payload await approval.
  /v1/source-accounts:
    get:
      operationId: listSourceAccounts
      summary: List connected source accounts in the authorized Workspace
      x-pending-decisions: [source-records, session-and-scope]
      responses:
        "2XX":
          description: Source account item schema and pagination applicability await approval.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/source-resources:
    post:
      operationId: registerSourceResource
      summary: Register a public GitHub repository in the allowlist
      description: Access to the connection and public repository policy must be verified in the authorized Workspace.
      x-pending-decisions: [source-records, session-and-scope, mutation-wire]
      responses:
        "2XX":
          description: Registration response status and payload await approval.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      operationId: listSourceResources
      summary: List repositories and their policy status in the authorized Workspace
      x-pending-decisions: [source-records, session-and-scope]
      responses:
        "2XX":
          description: Source resource item schema and pagination applicability await approval.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/sync-runs:
    get:
      operationId: recoverInitialImportRun
      summary: Recover one readable import run for a repository
      description: >
        Use this read-only lookup when the run ID is unavailable. Resolve the
        repository in the current Workspace and filter out unreadable runs
        before ranking. Prefer a readable PENDING or RUNNING run. Otherwise
        choose the most recent terminal run by its latest transition into a
        terminal state after acceptance or retry, breaking timestamp ties by
        most recent creation. Updates to derived processing do not change this
        order. A readable repository with no readable runs returns an empty
        list. This lookup only reads existing state and never enqueues work
        or contacts the provider.
      x-pending-decisions: [recovery-lookup, session-and-scope]
      parameters:
        - name: source_resource_id
          in: query
          required: true
          schema: { type: string, minLength: 1 }
          example: synthetic-repo
        - name: limit
          in: query
          schema: { type: integer, const: 1, default: 1 }
          example: 1
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Zero or one readable run with its current status.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
            Cache-Control: { $ref: "#/components/headers/PrivateNoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveredSyncRuns" }
              examples:
                empty:
                  value: { items: [] }
                terminal:
                  value:
                    items:
                      - target_id: synthetic-run-1
                        status_url: /v1/sync-runs/synthetic-run-1
                        import_status:
                          status: SUCCESS
                          plan_id: synthetic-plan-1
                          import_ready: true
                          processing_status: BLOCKED_POLICY
                          source_drift: false
                          retry: { allowed: false }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Empty response shared by unknown, inaccessible, and other-Workspace repositories.
        "422":
          description: Empty response for a missing or empty source_resource_id or a limit other than 1.
    post:
      operationId: createInitialImport
      summary: Request a one-time initial import plan
      description: >
        Check Workspace access and repository policy before starting or replaying.
        An in-window replay of the same key and request returns the original
        202 target. A distinct request while the repository has an active run yields
        SYNC_ALREADY_RUNNING. Include the existing run ID only if the caller
        can currently read that run. After a successful import, the repository
        rejects further automatic imports. A replacement plan requires
        a separately confirmed abandonment of the latest terminal unfinished
        run and an explicit create with a new key. A replay is not a new plan.
      x-pending-decisions: [session-and-scope, import-defaults, worker-job-identity, idempotency-retention, abandonment-wire]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InitialImportRequest" }
            example:
              source_resource_id: synthetic-repo
              mode: INITIAL_BACKFILL
              backfill_from: "2025-09-23"
              limits:
                max_objects: 5000
      responses:
        "202": { $ref: "#/components/responses/SyncRunAccepted" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          $ref: "#/components/responses/InitialImportConflict"
        "422": { $ref: "#/components/responses/InvalidMutationRequest" }
        "5XX": { $ref: "#/components/responses/UnconfirmedAcceptance" }
  /v1/sync-runs/{id}:
    parameters:
      - $ref: "#/components/parameters/SyncRunID"
    get:
      operationId: getInitialImportStatus
      summary: Read run status, checkpoint progress, limits, and retry eligibility
      description: >
        Check Workspace and resource authorization before returning status.
        Use this endpoint on page re-entry or manual refresh when the ID is
        known. Return the latest derived processing status even for a terminal
        import. Automatic import polling can stop at a terminal state.
        Enable retry from retry.allowed rather than failure_reason.
      x-pending-decisions: [session-and-scope, status-vocabularies]
      x-documented-domain-codes: [SYNC_PARTIAL, SYNC_PARTIAL_WITH_LIMIT, IMPORT_SOURCE_DRIFT]
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Import and derived processing status, including PARTIAL and PARTIAL_WITH_LIMIT.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
            Cache-Control: { $ref: "#/components/headers/PrivateNoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportStatus" }
              examples:
                transientPartial:
                  value:
                    status: PARTIAL
                    plan_id: synthetic-plan-1
                    failure_reason: TRANSIENT_PROVIDER_ERROR
                    streams:
                      - type: PR
                        status: PARTIAL
                        last_committed_page: 7
                        unresolved_failures: 1
                    import_ready: false
                    processing_status: NOT_STARTED
                    observed_at: "2026-10-05T09:00:00Z"
                    source_drift: false
                    processed_range: "2025-09-23 through 2026-08-31"
                    remaining_range: "2026-09-01 through 2026-10-05"
                    retry: { allowed: true, from_safe_checkpoint: true }
                itemLimit:
                  value:
                    status: PARTIAL_WITH_LIMIT
                    plan_id: synthetic-plan-2
                    failure_reason: SYNC_PARTIAL_WITH_LIMIT
                    source_drift: false
                    import_ready: false
                    processing_status: NOT_STARTED
                    processed_range: "2025-09-23 through 2026-08-31"
                    remaining_range: "2026-09-01 through 2026-10-05"
                    retry: { allowed: false }
                planDrift:
                  value:
                    status: PARTIAL
                    plan_id: synthetic-plan-3
                    failure_reason: PLAN_DRIFT
                    source_drift: true
                    import_ready: false
                    processing_status: NOT_STARTED
                    retry: { allowed: false }
                policyChangedAfterSuccess:
                  value:
                    status: SUCCESS
                    plan_id: synthetic-plan-4
                    source_drift: false
                    import_ready: true
                    processing_status: BLOCKED_POLICY
                    retry: { allowed: false }
                importPolicyBlocked:
                  value:
                    status: PARTIAL
                    plan_id: synthetic-plan-5
                    failure_reason: SOURCE_POLICY_BLOCKED
                    source_drift: false
                    import_ready: false
                    processing_status: NOT_STARTED
                    retry: { allowed: false }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/sync-runs/{id}/retry:
    parameters:
      - $ref: "#/components/parameters/SyncRunID"
    post:
      operationId: retryInitialImport
      summary: Resume the same run from its safe checkpoint
      description: >
        Send a bodyless request. The caller must have current access on each
        attempt, including a replay. Retry preserves the run and its plan.
        A temporary provider failure with a safe checkpoint can be resumed.
        Plan drift, structurally incomplete required data, policy blocks, and
        exhausted plan limits require a new plan. An in-window replay returns
        the original 202 target without another resume.
      x-pending-decisions: [session-and-scope, worker-job-identity, idempotency-retention]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "202": { $ref: "#/components/responses/SyncRunAccepted" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          $ref: "#/components/responses/RetryConflict"
        "422": { $ref: "#/components/responses/InvalidMutationRequest" }
        "5XX": { $ref: "#/components/responses/UnconfirmedAcceptance" }
components:
  securitySchemes:
    SupabaseAccessJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Backend bearer input as documented. The server validates the access
        JWT and checks current Workspace membership, role, and resource access.
        Browser session transport, rotation, revocation, and CSRF are OD-010.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Candidate scope is the current Workspace and operation, with separate
        namespaces for create and retry. Compare the parsed create body or
        the retry target ID. Preserve the 202 target for 24 hours from acceptance
        without extending the window on replay. Recheck access before exposing
        replay or key-conflict information. A known expired key returns
        IDEMPOTENCY_KEY_EXPIRED while its marker is retained with run history.
      schema: { type: string, format: uuid }
      example: 00000000-0000-4000-8000-000000000001
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: Optional client request identifier echoed by the API.
      schema: { type: string }
      example: synthetic-request-1
    SyncRunID:
      name: id
      in: path
      required: true
      description: Sync run identifier. An identifier alone conveys no access.
      schema: { type: string }
      example: synthetic-run-1
  headers:
    RequestID:
      description: Echo of the optional X-Request-ID.
      schema: { type: string }
      example: synthetic-request-1
    PrivateNoStore:
      required: true
      description: Use current access and status on every lookup.
      schema: { const: "private, no-store" }
  responses:
    Unauthenticated:
      description: Authentication failed. Route-specific error payload is pending.
    Forbidden:
      description: >
        Insufficient current Workspace membership or role. Concealment of an
        inaccessible object and its exact error mapping await approval.
    SyncRunAccepted:
      description: Accepted for processing. For retry, target_id and status_url point to the original run.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SyncRunAccepted" }
    InitialImportConflict:
      description: >
        An in-window key identifies a different request, a known key expired,
        or the repository already has an active run. A rejected restart after
        success or a plan awaiting abandonment retains the empty response.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ImportConflict" }
          examples:
            activeRun:
              value:
                error:
                  code: SYNC_ALREADY_RUNNING
                  details:
                    existing_run_id: synthetic-run-1
            idempotency:
              value:
                error:
                  code: IDEMPOTENCY_CONFLICT
            expiredKey:
              value:
                error:
                  code: IDEMPOTENCY_KEY_EXPIRED
    RetryConflict:
      description: >
        An in-window key identifies a different request, a known key expired,
        or the run is active. When the run cannot resume from a safe checkpoint,
        the response is empty. Read the run status for retry eligibility.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ImportConflict" }
    InvalidMutationRequest:
      description: Missing or invalid Idempotency-Key, or an invalid request body. The review stub returns an empty body.
    UnconfirmedAcceptance:
      description: >
        A server error leaves acceptance unknown. Use the known run ID or
        repository recovery lookup to check state. Do not automatically send
        another POST. An explicit resend can use the same key and request
        within the retention window.
  schemas:
    InitialImportRequest:
      type: object
      required: [source_resource_id, mode]
      properties:
        source_resource_id:
          type: string
          description: Identifier of the allowed public repository in the authorized Workspace.
        mode:
          const: INITIAL_BACKFILL
          description: Explicit mode for the one-time initial import.
        backfill_from:
          type: string
          format: date
          description: Requested inclusive start date in the plan. Omission behavior awaits approval.
        limits:
          type: object
          description: Requested item limits. Defaulting and validation bounds await approval.
          properties:
            max_objects: { type: integer }
    SyncRunAccepted:
      type: object
      required: [target_id, status_url]
      properties:
        job_id:
          type: string
          description: Optional Worker identifier. WEB polls by target_id and status_url independently of this field.
        status: { const: PENDING }
        target_type: { const: SYNC_RUN }
        target_id:
          type: string
          description: Sync run identifier. Retry returns the original run identifier.
        status_url:
          type: string
          pattern: '^/v1/sync-runs/[^/?#]+$'
          description: >
            Relative path for the same run as target_id. It must equal
            /v1/sync-runs/ followed by target_id encoded as one path segment.
            A client must verify that the fields agree before requesting it.
    RecoveredSyncRuns:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 1
          items:
            type: object
            required: [target_id, status_url, import_status]
            properties:
              target_id: { $ref: "#/components/schemas/SyncRunAccepted/properties/target_id" }
              status_url: { $ref: "#/components/schemas/SyncRunAccepted/properties/status_url" }
              import_status: { $ref: "#/components/schemas/ImportStatus" }
    ImportState:
      type: string
      enum: [PENDING, RUNNING, SUCCESS, PARTIAL, PARTIAL_WITH_LIMIT, FAILED, CANCELED]
    ProcessingStatus:
      type: string
      enum: [NOT_STARTED, RUNNING, BLOCKED_POLICY, BLOCKED_SOURCE, FAILED, COMPLETE]
    ImportStatus:
      type: object
      required: [status, plan_id, import_ready, processing_status, source_drift, retry]
      description: Optional fields are omitted when unavailable or inapplicable.
      properties:
        status: { $ref: "#/components/schemas/ImportState" }
        plan_id:
          type: string
          description: Identifier of the immutable plan.
        failure_reason:
          type: string
          description: Present for PARTIAL, PARTIAL_WITH_LIMIT, and FAILED. The full reason vocabulary awaits review.
        streams:
          type: array
          items: { $ref: "#/components/schemas/StreamProgress" }
        import_ready:
          type: boolean
          description: The final import succeeded and committed its single IMPORT_READY intent.
        processing_status:
          $ref: "#/components/schemas/ProcessingStatus"
        observed_at:
          type: string
          format: date-time
          description: Source observation time when available.
        source_drift:
          type: boolean
          description: True for PARTIAL with PLAN_DRIFT.
        processed_range:
          type: string
          description: Display summary of completed scope, when available.
        remaining_range:
          type: string
          description: Display summary of remaining scope. Required for PARTIAL_WITH_LIMIT.
        retry:
          type: object
          required: [allowed]
          properties:
            allowed: { type: boolean }
            from_safe_checkpoint:
              const: true
              description: Present only when retry.allowed is true.
          if:
            properties:
              allowed: { const: true }
          then:
            required: [from_safe_checkpoint]
          else:
            not: { required: [from_safe_checkpoint] }
      allOf:
        - if:
            properties:
              status: { const: SUCCESS }
          then:
            properties:
              import_ready: { const: true }
          else:
            properties:
              import_ready: { const: false }
              processing_status: { const: NOT_STARTED }
        - if:
            properties:
              status: { enum: [PARTIAL, PARTIAL_WITH_LIMIT, FAILED] }
          then:
            required: [failure_reason]
          else:
            not: { required: [failure_reason] }
        - if:
            properties:
              status: { const: PARTIAL_WITH_LIMIT }
          then:
            required: [remaining_range]
        - if:
            required: [failure_reason]
            properties:
              failure_reason: { const: PLAN_DRIFT }
          then:
            properties:
              status: { const: PARTIAL }
              source_drift: { const: true }
          else:
            properties:
              source_drift: { const: false }
        - if:
            properties:
              retry:
                properties:
                  allowed: { const: true }
          then:
            required: [failure_reason]
            properties:
              status: { const: PARTIAL }
              failure_reason: { const: TRANSIENT_PROVIDER_ERROR }
              source_drift: { const: false }
    StreamProgress:
      type: object
      required: [type, status]
      description: Progress of a known stream. Unknown counts are omitted. Stream/status vocabularies await review.
      properties:
        type: { type: string }
        status: { type: string }
        last_committed_page: { type: integer, minimum: 0 }
        unresolved_failures: { type: integer, minimum: 0 }
    ImportConflict:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code]
          properties:
            code:
              enum: [IDEMPOTENCY_CONFLICT, SYNC_ALREADY_RUNNING, IDEMPOTENCY_KEY_EXPIRED]
            details:
              type: object
              required: [existing_run_id]
              properties:
                existing_run_id:
                  type: string
                  description: Present only if the caller can currently read the active run.
          if:
            properties:
              code: { enum: [IDEMPOTENCY_CONFLICT, IDEMPOTENCY_KEY_EXPIRED] }
          then:
            not: { required: [details] }

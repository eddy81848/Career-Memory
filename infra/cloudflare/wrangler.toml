name = "career-memory-edge"
main = "src/worker.mjs"
compatibility_date = "2025-09-01"
workers_dev = false

routes = [
  { pattern = "career-memory.site", custom_domain = true },
  { pattern = "www.career-memory.site", custom_domain = true }
]

[vars]
CANONICAL_HOST = "career-memory.site"
# Encrypted secrets (never stored in Git; managed via `wrangler secret put`):

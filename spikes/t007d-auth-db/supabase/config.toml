# Isolated ephemeral local Supabase CLI configuration for T-007D AUTHDB-03.
# Uses a dedicated project_id and high non-default ports (54921-54929) to avoid
# colliding with any other local Supabase projects. Never links to hosted Supabase.

project_id = "t007d-authdb-ephemeral"

[api]
enabled = true
port = 54921
# Deliberately expose only empty/public safe view; domain schema `app_t007d` is NOT exposed.
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 100

[db]
port = 54922
shadow_port = 54920
major_version = 15

[db.pooler]
enabled = false
port = 54929

[studio]
enabled = false
port = 54923

[inbucket]
enabled = true
port = 54924
smtp_port = 54925
pop3_port = 54926

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 300
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[analytics]
enabled = false

[edge_runtime]
enabled = false
